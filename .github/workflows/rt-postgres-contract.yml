name: RT PostgreSQL contract stages 1-2
on:
  push:
    branches: ['dev/rt-postgres-contract-stage-1-2']
    paths:
      - 'database/rt/**'
      - '.github/workflows/rt-postgres-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: rt_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rt_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RT_TEST_DSN: postgresql://postgres:ephemeral-test-only@127.0.0.1:5432/rt_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r database/rt/requirements-test.txt
      - name: Contract and concurrent transactions (fictional data only)
        run: python database/rt/test_contract.py
      - name: Restart isolated PostgreSQL container
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker restart "$POSTGRES_CONTAINER"
      - name: Verify durability after restart
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import time
          import psycopg
          for attempt in range(20):
              try:
                  with psycopg.connect(os.environ["RT_TEST_DSN"]) as c:
                      c.execute("SELECT 1")
                  break
              except psycopg.OperationalError:
                  if attempt == 19:
                      raise
                  time.sleep(1)
          subprocess.run([sys.executable, "database/rt/test_contract.py",
                          "--verify-restart"], check=True)
          PY
